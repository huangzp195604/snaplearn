    <script>
      (function() {
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && (e.message.indexOf('chrome-extension://') !== -1 || e.message.indexOf('Blocked a frame with origin') !== -1))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
